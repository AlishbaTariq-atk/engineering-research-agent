[project]
name = "research-agent"
version = "0.1.0"
description = "Multi-source ingestion, category-aware retrieval, MCP server, and agentic research briefs over an AI/ML systems knowledge base."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-chroma>=0.1",
    "langchain-huggingface>=0.1",
    "langchain-groq>=0.2",
    "langchain-ollama>=0.2",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "pymupdf>=1.24",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research_agent"]
